scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
}

type NotionIntegration {
  id: String
  userfrontUserId: String
  tokenType: String
  workspaceId: String
  workspaceName: String
  workspaceIcon: String
  botId: String
  userId: String
  userFullName: String
  avatarUrl: String
  type: String
  email: String
}

type NotionDatabaseInfo {
  title: String
  url: String
  icon: String
  needsFormatting: Boolean
}

input Email {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

type AddEmailToNotionResult {
  success: Boolean
  notionPageId: String
}

enum UpdateDecoEmailErrorReasons {
  ALREADY_TAKEN
  INVALID_FORMAT
  CANNOT_CHANGE_EMAIL
}

type UpdateDecoEmailResult {
  success: Boolean!
  errorReason: UpdateDecoEmailErrorReasons
}

type Query {
  getUserMetaByDecoEmail(decoEmail: String): Boolean
  currentUser: User
  getCurrentUserNotionIntegration: NotionIntegration
  emailUsernameAvailable(username: String!): Boolean
  getCurrentUserNotionDatabaseInfo: NotionDatabaseInfo
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  setDecoEmail(username: String): UpdateDecoEmailResult
  addEmailToNotion(toAddress: String, newEmail: Email): AddEmailToNotionResult
}
