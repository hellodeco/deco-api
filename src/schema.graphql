scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
  subscriptionStatus: String
}

type NotionIntegration {
  id: String
  userfrontUserId: String
  tokenType: String
  workspaceId: String
  workspaceName: String
  workspaceIcon: String
  botId: String
  userId: String
  userFullName: String
  avatarUrl: String
  type: String
  email: String
}

enum NotionDatabaseStatus {
  NOT_SHARED
  NOT_CONNECTED
  CONNECTED
}

type NotionDatabaseInfo {
  title: String
  url: String
  status: NotionDatabaseStatus
  type: NotionDatabaseType
  # user needs to manually format the notion page
  needsManualFormatting: Boolean
}

input Email {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

enum UpdateDecoEmailErrorReasons {
  ALREADY_TAKEN
  INVALID_FORMAT
  NOT_ENOUGH_CHARS
  CANNOT_CHANGE_EMAIL
  NO_SUBSCRIPTION
}

enum NotionDatabaseType {
  EMAIL
  CONTACTS
}

type UpdateDecoEmailResult {
  success: Boolean!
  errorReason: UpdateDecoEmailErrorReasons
}

type CreateUserfrontAndDecoUserResult {
  success: Boolean!
  errorMessage: String
}

type ConnectedNotionEntities {
  pages: [NotionPage]
  databases: [NotionDatabaseInfo]
}

type NotionFile {
  url: String
}

type NotionIcon {
  type: String
  emoji: String
  url: String
}

type NotionPage {
  id: String
  title: String
  url: String
  icon: NotionIcon
}

type NotionEmailCreatedResponse {
  pageId: String
  notionEmailDatabaseId: String
  notionPageURL: String
}

type SendEmailResponse {
  inboxPageURL: String
}

type Query {
  currentUser: User
  getCurrentUserNotionIntegration: NotionIntegration
  emailUsernameAvailable(username: String!): Boolean
  getCurrentUserNotionDatabaseInfo: [NotionDatabaseInfo]
  emailDomain: String
  # will return list of databases and pages that the current user has shared
  connectedNotionPages: [NotionPage]
  currentUserHasFileAccess(attachmentId: String!): Boolean
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  setDecoEmail(username: String): UpdateDecoEmailResult
  # TODO make type a required arg in a followon PR once the frontend uses this updated mutation
  selectNotionDatabase(databaseId: String!, type: NotionDatabaseType!): Boolean
  createUserfrontAndDecoUser(
    email: String
    password: String
  ): CreateUserfrontAndDecoUserResult
  createEmailReplyPage(originalEmailUUID: String): NotionEmailCreatedResponse
  sendEmailReply(
    notionPageID: String
    originalEmailUUID: String
  ): SendEmailResponse
  createEmailPage: NotionEmailCreatedResponse
  sendEmail(notionPageID: String): SendEmailResponse
}
