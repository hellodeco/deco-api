scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
}

type NotionIntegration {
  id: String
  userfrontUserId: String
  tokenType: String
  workspaceId: String
  workspaceName: String
  workspaceIcon: String
  botId: String
  userId: String
  userFullName: String
  avatarUrl: String
  type: String
  email: String
}

enum NotionDatabaseStatus {
  NOT_SHARED
  NOT_CONNECTED
  CONNECTED
}

type NotionDatabaseInfo {
  title: String
  url: String
  icon: String
  needsFormatting: Boolean
  status: NotionDatabaseStatus
}

input Email {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

enum UpdateDecoEmailErrorReasons {
  ALREADY_TAKEN
  INVALID_FORMAT
  NOT_ENOUGH_CHARS
  CANNOT_CHANGE_EMAIL
  NO_SUBSCRIPTION
}

type UpdateDecoEmailResult {
  success: Boolean!
  errorReason: UpdateDecoEmailErrorReasons
}

type ConnectedNotionEntities {
  pages: [NotionPage]
  databases: [NotionDatabaseInfo]
}

type NotionFile {
  url: String
}

