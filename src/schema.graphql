type Query {
  allEmails: [Email]!
  currentUser: User
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String],
  formatNotionTable: Boolean
  addEmailToNotion(newEmail: {
    subject: String
    from: String
    emailID: Int
    emailThreadID: Int
    plainTextContent: String
  }): String
}
