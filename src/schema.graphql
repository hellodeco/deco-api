scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
  subscriptionStatus: String
}

type NotionIntegration {
  id: String
  userfrontUserId: String
  tokenType: String
  workspaceId: String
  workspaceName: String
  workspaceIcon: String
  botId: String
  userId: String
  userFullName: String
  avatarUrl: String
  type: String
  email: String
}

enum NotionDatabaseStatus {
  NOT_SHARED
  NOT_CONNECTED
  CONNECTED
}

type NotionDatabaseInfo {
  title: String
  url: String
  icon: String
  status: NotionDatabaseStatus
  # needs to be formatted programatically by deco
  needsFormatting: Boolean
  # user needs to manually format the notion page
  needsManualFormatting: Boolean
}

input SendMailBetaAttachmentInput {
  id: String!
  name: String!
  mimetype: String!
  size: Int
}

input SendMailBetaRecipientInput {
  email: String!
  name: String
}

input SendMailBetaEmail {
  subject: String
  to: [SendMailBetaRecipientInput!]!
  cc: [SendMailBetaRecipientInput]
  bcc: [SendMailBetaRecipientInput]
  plainTextContent: String
  attachments: [SendMailBetaAttachmentInput]
}

input SendMailBetaArgs {
  inReplyToEmailId: Int
}

type SendMailBetaResult {
  success: Boolean
  message: String
}

enum UpdateDecoEmailErrorReasons {
  ALREADY_TAKEN
  INVALID_FORMAT
  NOT_ENOUGH_CHARS
  CANNOT_CHANGE_EMAIL
  NO_SUBSCRIPTION
}

type UpdateDecoEmailResult {
  success: Boolean!
  errorReason: UpdateDecoEmailErrorReasons
}

type CreateUserfrontAndDecoUserResult {
  success: Boolean!
  errorMessage: String
}

type ConnectedNotionEntities {
  pages: [NotionPage]
  databases: [NotionDatabaseInfo]
}

type NotionFile {
  url: String
}

type NotionIcon {
  type: String
  emoji: String
  url: String
}

type NotionPage {
  id: String
  title: String
  url: String
  icon: NotionIcon
}


type Query {
  currentUser: User
  getCurrentUserNotionIntegration: NotionIntegration
  emailUsernameAvailable(username: String!): Boolean
  getCurrentUserNotionDatabaseInfo: NotionDatabaseInfo
  emailDomain: String
  # will return list of databases and pages that the current user has shared
  connectedNotionPages: [NotionPage]
  currentUserHasFileAccess(attachmentId: String!): Boolean
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  setDecoEmail(username: String): UpdateDecoEmailResult
  selectNotionDatabase(databaseId: String!): Boolean
  createUserfrontAndDecoUser(
    email: String
    password: String
  ): CreateUserfrontAndDecoUserResult
  sendMailBeta(email: SendMailBetaEmail!, args: SendMailBetaArgs): SendMailBetaResult
}
