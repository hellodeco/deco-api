type NotionIcon {
  type: String
  emoji: String
  url: String
}

# union NotionIcon =
#     NotionExternalImageFileIcon
#   | NotionImageFileIcon
#   | NotionEmojiIcon

type NotionPage {
  id: String
  title: String
  url: String
  icon: NotionIcon
}

type Query {
  currentUser: User
  getCurrentUserNotionIntegration: NotionIntegration
  emailUsernameAvailable(username: String!): Boolean
  getCurrentUserNotionDatabaseInfo: NotionDatabaseInfo
  emailDomain: String
  # will return list of databases and pages
  currentUserConnectedNotionPages: [NotionPage]
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  setDecoEmail(username: String): UpdateDecoEmailResult
}
