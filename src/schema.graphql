scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
}

type Email {
  subject: String
  body: String
  from: String
}

input NewEmailInput {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

type Query {
  allEmails: [Email]!
  getUserMetaByDecoEmail(decoEmail: String): Boolean
  currentUser: User
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  addEmailToNotion(newEmail: NewEmailInput): String
}
