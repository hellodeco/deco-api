scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
}

input Email {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

type AddEmailToNotionResult {
  success: Boolean
  notionPageId: String
}

type Query {
  getUserMetaByDecoEmail(decoEmail: String): Boolean
  currentUser: User
  emailAddressAvailable(email: String): Boolean
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  addEmailToNotion(toAddress:String, newEmail: Email): AddEmailToNotionResult
}
