scalar UUID

type User {
  fullName: String
  emailAddress: String
  signupEmail: String
  userfrontID: UUID
}

type Email {
  subject: String
  body: String
  from: String
}

type NotionIntegration {
  id: String
  userfrontUserId: String
  tokenType: String
  workspaceId: String
  workspaceName: String
  workspaceIcon: String
  botID: String
  userID: String
  userFullName: String
  avatarURL: String
  type: String
  email: String
}

input NewEmailInput {
  subject: String
  from: String
  emailID: Int
  emailThreadID: Int
  plainTextContent: String
}

type Query {
  allEmails: [Email]!
  getUserMetaByDecoEmail(decoEmail: String): Boolean
  currentUser: User
  emailAddressAvailable(email: String): Boolean
  getCurrentUserNotionIntegration: NotionIntegration
}

type Mutation {
  wipeNotionDatabase: [String]
  deleteNotionTableProperties: [String]
  formatNotionTable: Boolean
  updateDecoEmail(emailAddress: String): Boolean
  addEmailToNotion(newEmail: NewEmailInput): String
}
